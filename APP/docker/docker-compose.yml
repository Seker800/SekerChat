services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sekerchat-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3100:3100"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sekerchat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
