<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sekerchatForAndroid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0e14;
      color: #e6e8ec;
      padding: 24px 20px;
      max-width: 420px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; margin-bottom: 24px; }
    label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px;
      background: #1a1e26; border: 1px solid #2d3340;
      border-radius: 8px; color: #e6e8ec; font-size: 15px;
    }
    input:focus { outline: none; border-color: #4880ff; }
    .section { margin-bottom: 20px; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0;
    }
    .toggle {
      width: 48px; height: 28px; border-radius: 14px;
      border: none; cursor: pointer; position: relative;
      background: #2d3340; transition: background 0.2s;
    }
    .toggle.on { background: #4880ff; }
    .toggle::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #fff; transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      background: #4880ff; color: #fff;
    }
    .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .success { font-size: 13px; color: #4ade80; margin-top: 4px; }
    .error { font-size: 13px; color: #f87171; margin-top: 4px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>sekerchatForAndroid</h1>

  <div class="section">
    <label for="url">SekerChat 地址</label>
    <input id="url" type="url" placeholder="https://chat.example.com" autocomplete="off" />
    <div class="hint">填写你部署 SekerChat 的完整地址</div>
  </div>

  <div class="section">
    <div class="toggle-row">
      <span>后台常驻</span>
      <button id="bg-toggle" class="toggle" type="button"></button>
    </div>
    <div class="hint">开启后 app 在后台不被系统杀死，保持实时连接</div>
  </div>

  <div style="margin-top:24px">
    <button id="save-btn" class="btn">保存并进入</button>
    <div id="save-msg"></div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
