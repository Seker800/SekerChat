x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the deployed image with a sha256 digest}
    container_name: sekerchat-postgres
    env_file: [../.env]
    volumes:
      - ../../runtime/postgres:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    logging: *default-logging
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to the deployed image with a sha256 digest}
    container_name: sekerchat-minio
    command: server /data --console-address ":9001"
    env_file: [../.env]
    volumes:
      - ../../runtime/minio:/data
    ports: ["9000:9000", "127.0.0.1:9001:9001"]
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  data:
    external: true
    name: ${APP_NETWORK_NAME:-sekerchat_sekerchat}
