services:
  postgres:
    image: postgres:16-alpine
    container_name: sekerchat-postgres
    env_file: [../.env]
    volumes:
      - ../../runtime/postgres:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: sekerchat-minio
    command: server /data --console-address ":9001"
    env_file: [../.env]
    volumes:
      - ../../runtime/minio:/data
    ports: ["9000:9000", "9001:9001"]
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  data:
    external: true
    name: ${APP_NETWORK_NAME:-sekerchat_sekerchat}
