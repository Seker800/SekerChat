version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /APP
      - /APP/apps/mobile-shell
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 6
    groups:
      npm-patch-updates:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    groups:
      github-actions-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: docker
    directories:
      - /APP/apps/backend
      - /APP/apps/frontend-react
      - /APP/docker
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    groups:
      docker-patch-updates:
        patterns:
          - "*"
        update-types:
          - patch
