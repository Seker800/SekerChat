name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: APP

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: https://im.example.com
      API_BASE_URL: http://127.0.0.1:3100/api
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sekerchat_ci?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: sekerchat-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      FILE_ACCESS_SECRET: ci-file-access-secret
      FILE_ACCESS_TTL: 15m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate --workspace @sekerchat/backend
      - run: npm run prisma:validate --workspace @sekerchat/backend
      - run: npm run architecture:check
      - run: npm run open-source:check
      - run: npm run deployment:check
      - run: npm run ci:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run contracts:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run bundle:check
      - run: npm run security:audit:ci

  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  mobile-shell-audit:
    name: Mobile shell dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/apps/mobile-shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/apps/mobile-shell/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  migrations:
    name: Empty database migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sekerchat_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sekerchat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sekerchat_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sekerchat_ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate --workspace @sekerchat/backend
      - run: npm run prisma:deploy --workspace @sekerchat/backend
      - run: npm run prisma:status --workspace @sekerchat/backend
      - run: npm run test:integration --workspace @sekerchat/backend

  workspace-smoke:
    name: Mocked workspace smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: APP/playwright-report
          if-no-files-found: ignore

  desktop-pet:
    name: Windows desktop pet build and lifecycle tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project native/desktop-pet/tests/SekerChat.DesktopPet.CoreTests/SekerChat.DesktopPet.CoreTests.csproj --configuration Release
      - run: dotnet publish native/desktop-pet/src/SekerChat.DesktopPet/SekerChat.DesktopPet.csproj --configuration Release --runtime win-x64 --self-contained true --output native/desktop-pet/artifacts/win-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-pet-win-x64-unsigned-test
          path: APP/native/desktop-pet/artifacts/win-x64/SekerChat.DesktopPet.exe
          if-no-files-found: error

  image-smoke:
    name: Production image security (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: apps/backend/Dockerfile
            image: sekerchat-backend:ci
          - name: frontend
            dockerfile: apps/frontend-react/Dockerfile
            image: sekerchat-frontend:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file ${{ matrix.dockerfile }} --tag ${{ matrix.image }} .
      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}
          artifact-name: sekerchat-${{ matrix.name }}-sbom.spdx.json
          output-file: sekerchat-${{ matrix.name }}-sbom.spdx.json
          format: spdx-json
      - name: Scan image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
